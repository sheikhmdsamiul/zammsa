services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: zammsa_db
      POSTGRES_USER: zammsa_user
      POSTGRES_PASSWORD: zammsa_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammsa_user -d zammsa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - backend/.env
    environment:
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A zammsa_backend worker -l info --concurrency=4
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - backend/.env
    environment:
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A zammsa_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    env_file:
      - backend/.env
    environment:
      DEBUG: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
